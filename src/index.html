<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>

<body>
    <div id="content">
        <div class="top-bar">
            <button class="toggle-sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" />
                </svg>
            </button>
            <h1>Did Do?</h1>
        </div>
        <div class="sidebar">
            <div class="home">
                <h2>Home</h2>
                <button class="home-option">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M11 15H17V17H11V15M9 7H7V9H9V7M11 13H17V11H11V13M11 
                        9H17V7H11V9M9 11H7V13H9V11M21 5V19C21 20.1 20.1 21 19 
                        21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H19C20.1 3 21 
                        3.9 21 5M19 5H5V19H19V5M9 15H7V17H9V15Z" />
                    </svg>
                    <p>All Tasks</p>
                </button>
                <button class="home-option">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M19 3H18V1H16V3H8V1H6V3H5C3.9 3 3 3.89 3 5V19C3 20.11 
                        3.9 21 5 21H19C20.11 21 21 20.11 21 19V5C21 3.89 20.11 3 
                        19 3M19 19H5V9H19V19M19 7H5V5H19M7 11H12V16H7" />
                    </svg>
                    <p>Today</p>
                </button>
                <button class="home-option">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M6 1V3H5C3.89 3 3 3.89 3 5V19C3 20.11 3.9 21 5 21H19C20.11 21 21 20.11 21 
                            19V5C21 3.9 20.11 3 19 3H18V1H16V3H8V1H6M5 8H19V19H5V8M11 9V14H13V9H11M11 
                            16V18H13V16H11Z" />
                    </svg>
                    <p>Incomplete</p>
                </button>
                <button class="home-option">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M19,19H5V8H19M19,3H18V1H16V3H8V1H6V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 
                            5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M16.53,11.06L15.47,10L10.59,14.88L8.47,
                            12.76L7.41,13.82L10.59,17L16.53,11.06Z" />
                    </svg>
                    <p>Complete</p>
                </button>
            </div>
            <div class="projects">
                <h2>Projects</h2>
                <div class="project-controls">
                    <button class="add-project">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
                        </svg>
                        <p>New Project</p>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
